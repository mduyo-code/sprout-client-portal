<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Sprout Billings Portal</title>
<style>
/* ---------- Tokens ---------- */
:root{
  --bg:#F5F7F0;
  --surface:#FFFFFF;
  --surface-2:#EDF1E6;
  --surface-3:#E1E9D6;
  --border:#DBE3D0;
  --border-soft:#E7EDDE;
  --text:#1C2A1E;
  --text-muted:#5E6E58;
  --text-faint:#8A9884;
  --accent:#2E7D4F;
  --accent-strong:#1F5C39;
  --accent-soft:#E3F0E6;
  --on-accent:#FFFFFF;
  --good:#2E7D4F;
  --good-soft:#E3F0E6;
  --warning:#AD701A;
  --warning-soft:#FBF0DD;
  --critical:#B23A44;
  --critical-soft:#FAE4E5;
  --info:#3868A6;
  --info-soft:#E7EEF6;
  --neutral:#5E6E58;
  --neutral-soft:#EAEEE3;
  --shadow:0 1px 2px rgba(28,42,30,.06),0 6px 16px rgba(28,42,30,.06);
  --radius:10px;
  --radius-sm:7px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10140E;
    --surface:#161C13;
    --surface-2:#1C2417;
    --surface-3:#242F1D;
    --border:#2B3524;
    --border-soft:#232C1C;
    --text:#E7EDE0;
    --text-muted:#9FAE96;
    --text-faint:#6E7D67;
    --accent:#5FBE85;
    --accent-strong:#8AD6A6;
    --accent-soft:#1E3325;
    --on-accent:#0E170F;
    --good:#5FBE85;
    --good-soft:#1E3325;
    --warning:#E2A749;
    --warning-soft:#3A2C13;
    --critical:#E37D84;
    --critical-soft:#3B1C1E;
    --info:#7FAEDD;
    --info-soft:#182A3D;
    --neutral:#9FAE96;
    --neutral-soft:#1F261A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10140E;
  --surface:#161C13;
  --surface-2:#1C2417;
  --surface-3:#242F1D;
  --border:#2B3524;
  --border-soft:#232C1C;
  --text:#E7EDE0;
  --text-muted:#9FAE96;
  --text-faint:#6E7D67;
  --accent:#5FBE85;
  --accent-strong:#8AD6A6;
  --accent-soft:#1E3325;
  --on-accent:#0E170F;
  --good:#5FBE85;
  --good-soft:#1E3325;
  --warning:#E2A749;
  --warning-soft:#3A2C13;
  --critical:#E37D84;
  --critical-soft:#3B1C1E;
  --info:#7FAEDD;
  --info-soft:#182A3D;
  --neutral:#9FAE96;
  --neutral-soft:#1F261A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px rgba(0,0,0,.4);
  color-scheme:dark;
}

/* ---------- Reset ---------- */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-family:'IBM Plex Sans',sans-serif;}
p{margin:0;}
button{font-family:inherit;}
a{color:var(--accent-strong);}
.mono{font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;font-variant-numeric:tabular-nums;}
.num{font-variant-numeric:tabular-nums;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:248px;flex:0 0 248px;background:var(--surface-2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 14px;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:9px;padding:2px 6px;}
.brand-mark{width:26px;height:26px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;}
.brand-sub{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.07em;margin-top:-1px;}

.role-switch{display:flex;flex-direction:column;gap:4px;}
.role-switch-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);padding:0 6px;margin-bottom:2px;}
.role-btn{
  display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:var(--radius-sm);border:1px solid transparent;
  background:transparent;color:var(--text-muted);cursor:pointer;text-align:left;font-size:13px;font-weight:500;width:100%;
}
.role-btn:hover{background:var(--surface-3);}
.role-btn.active{background:var(--surface);border-color:var(--border);color:var(--text);box-shadow:var(--shadow);}
.role-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex:0 0 auto;}
.role-btn.active .dot{background:var(--accent);}

.nav{display:flex;flex-direction:column;gap:2px;margin-top:2px;}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);padding:8px 6px 2px;}
.nav-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);
  color:var(--text-muted);cursor:pointer;font-size:13.5px;font-weight:500;border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:var(--surface-3);color:var(--text);}
.nav-item.active{background:var(--accent);color:var(--on-accent);}
.nav-item .badge-count{font-size:11px;padding:1px 6px;border-radius:99px;background:var(--surface);color:var(--text-muted);font-family:'IBM Plex Mono';}
.nav-item.active .badge-count{background:rgba(255,255,255,.25);color:var(--on-accent);}

.sidebar-footer{margin-top:auto;padding:10px 6px;border-top:1px solid var(--border);font-size:11px;color:var(--text-faint);line-height:1.5;}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:16px 28px;gap:16px;backdrop-filter:blur(6px);
}
.topbar-title{display:flex;flex-direction:column;gap:2px;}
.topbar-title h1{font-size:19px;font-weight:650;}
.topbar-sub{font-size:12px;color:var(--text-faint);}
.topbar-right{display:flex;align-items:center;gap:14px;}
.sync-pill{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);padding:5px 10px;border-radius:99px;}
.sync-pill .live-dot{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft);}
.persona{display:flex;align-items:center;gap:9px;position:relative;}
.persona-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:0 0 auto;}
.persona-text{display:flex;flex-direction:column;line-height:1.25;}
.persona-name{font-size:12.5px;font-weight:600;}
.persona-role{font-size:10.5px;color:var(--text-faint);}
.persona-select{border:none;background:transparent;font-size:11px;color:var(--text-faint);cursor:pointer;font-family:inherit;padding:0;}
.bell-btn{position:relative;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-muted);}
.bell-btn:hover{background:var(--surface-2);}
.bell-dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--critical);border:1.5px solid var(--bg);}

.main{padding:24px 28px 60px;max-width:1180px;width:100%;margin:0 auto;}
.view-fade{animation:fadeIn .18s ease-out;}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

/* ---------- Building blocks ---------- */
.banner{
  display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px 16px;margin-bottom:22px;font-size:13px;color:var(--text);
}
.banner b{color:var(--accent-strong);}
.banner-close{margin-left:auto;background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:15px;padding:0 2px;flex:0 0 auto;}

.section{margin-bottom:30px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px;}
.section-head h2{font-size:15px;font-weight:650;}
.section-head .hint{font-size:12px;color:var(--text-faint);}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);}
.tile-label{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.tile-value{font-size:24px;font-weight:650;font-family:'IBM Plex Mono';letter-spacing:-.01em;}
.tile-sub{font-size:12px;color:var(--text-muted);margin-top:5px;}
.tile.accent-critical .tile-value{color:var(--critical);}
.tile.accent-warning .tile-value{color:var(--warning);}
.tile.accent-good .tile-value{color:var(--good);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:16px 18px;}

.btn{
  display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:9px 15px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;font-family:inherit;
}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn-ghost{background:none;border-color:transparent;color:var(--text-muted);}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.btn-danger-text{color:var(--critical);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

.quick-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
.table-wrap{overflow-x:auto;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:600;padding:0 14px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle;white-space:nowrap;}
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:var(--surface-2);}
td.wrap{white-space:normal;}
.row-title{font-weight:600;color:var(--text);}
.row-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;}
.pill-good{background:var(--good-soft);color:var(--good);}
.pill-warning{background:var(--warning-soft);color:var(--warning);}
.pill-critical{background:var(--critical-soft);color:var(--critical);}
.pill-info{background:var(--info-soft);color:var(--info);}
.pill-neutral{background:var(--neutral-soft);color:var(--neutral);}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

.empty{padding:34px 10px;text-align:center;color:var(--text-faint);font-size:13px;}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
select,input[type=text],input[type=number],input[type=date],textarea{
  font-family:inherit;font-size:13px;padding:8px 10px;border-radius:7px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);
}
select:focus,input:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:70px;}
.search-box{position:relative;}
.search-box input{padding-left:30px;min-width:200px;}
.search-box::before{content:"⌕";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-faint);}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid .full{grid-column:1/-1;}
.form-field{display:flex;flex-direction:column;gap:6px;}
.form-field label{font-size:12.5px;font-weight:600;color:var(--text);}
.form-field .opt{font-weight:400;color:var(--text-faint);}
.form-hint{font-size:11.5px;color:var(--text-faint);}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.check-row input{width:15px;height:15px;}
.file-drop{border:1.5px dashed var(--border);border-radius:8px;padding:14px;font-size:12.5px;color:var(--text-muted);text-align:center;cursor:pointer;background:var(--surface-2);}
.file-drop:hover{border-color:var(--accent);}
.file-drop.has-file{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);border-style:solid;}
.invoice-check-list{display:flex;flex-direction:column;gap:7px;max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:7px;padding:9px;}
.invoice-check-list label{display:flex;align-items:center;gap:8px;font-size:12.5px;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,12,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal.modal-wide{max-width:760px;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);}
.modal-head h3{font-size:16px;}
.modal-head p{font-size:12px;color:var(--text-faint);margin-top:3px;}
.modal-close{background:none;border:none;font-size:17px;color:var(--text-faint);cursor:pointer;}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:16px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px;}

/* ticket detail */
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.detail-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:16px 0;}
.detail-meta-item .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:3px;}
.detail-meta-item .v{font-size:13.5px;font-weight:600;}
.timeline{display:flex;flex-direction:column;gap:0;margin-top:4px;}
.timeline-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-soft);}
.timeline-item:last-child{border-bottom:none;}
.timeline-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:5px;flex:0 0 auto;}
.timeline-body b{font-size:13px;}
.timeline-time{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.timeline-note{font-size:13px;color:var(--text-muted);margin-top:4px;}
.timeline-note.internal{background:var(--warning-soft);color:var(--warning);padding:6px 9px;border-radius:6px;display:inline-block;}

/* chart bits */
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:16px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.bar-val{font-size:11px;font-family:'IBM Plex Mono';color:var(--text-muted);}
.bar-shape{width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 2px 2px;min-height:3px;}
.bar-label{font-size:10.5px;color:var(--text-faint);margin-top:2px;}
.hbar-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
.hbar-label{width:150px;flex:0 0 auto;font-size:12.5px;color:var(--text-muted);}
.hbar-track{flex:1;background:var(--surface-2);border-radius:5px;height:10px;overflow:hidden;}
.hbar-fill{height:100%;background:var(--accent);border-radius:5px;}
.hbar-val{width:34px;flex:0 0 auto;text-align:right;font-size:12px;font-family:'IBM Plex Mono';color:var(--text-muted);}

/* KPI / performance reporting */
.kpi-controls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:2px;background:var(--surface-2);gap:2px;}
.seg-btn{border:none;background:transparent;padding:6px 12px;font-size:12.5px;font-weight:600;border-radius:6px;color:var(--text-muted);cursor:pointer;font-family:inherit;}
.seg-btn:hover{color:var(--text);}
.seg-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
.kpi-legend{display:flex;gap:16px;font-size:12px;color:var(--text-muted);margin-bottom:6px;}
.kpi-legend-item{display:flex;align-items:center;gap:6px;}
.kpi-legend-dot{width:9px;height:9px;border-radius:2.5px;flex:0 0 auto;}
.gbars{display:flex;align-items:flex-end;gap:16px;height:150px;padding-top:16px;overflow-x:auto;}
.gbar-col{flex:0 0 auto;min-width:30px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.gbar-pair{display:flex;align-items:flex-end;gap:3px;height:100%;}
.gbar-shape{width:11px;border-radius:3px 3px 1px 1px;min-height:2px;}
.gbar-label{font-size:10px;color:var(--text-faint);margin-top:2px;white-space:nowrap;}
.kpi-team-head{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px;}
.kpi-team-head h3{font-size:13px;font-weight:650;}
tr.kpi-total td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--border);}

.rep-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border-soft);}
.rep-row:last-child{border-bottom:none;}
.rep-avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 auto;}
.rep-info{width:150px;flex:0 0 auto;}
.rep-name{font-weight:600;font-size:13px;}
.rep-sub{font-size:11px;color:var(--text-faint);}
.rep-bar-wrap{flex:1;}
.rep-flags{display:flex;gap:6px;flex:0 0 auto;}

.notif-list{display:flex;flex-direction:column;}
.notif-item{display:flex;gap:11px;padding:13px 4px;border-bottom:1px solid var(--border-soft);}
.notif-item:last-child{border-bottom:none;}
.notif-icon{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;}
.notif-item.unread{background:var(--accent-soft);border-radius:8px;}
.notif-text{font-size:13px;}
.notif-time{font-size:11px;color:var(--text-faint);margin-top:2px;}

.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:200;display:flex;align-items:center;gap:9px;max-width:340px;}
:root[data-theme="dark"] .toast, @media (prefers-color-scheme:dark){.toast{}}
.toast-dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:0 0 auto;}

.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
@media (max-width:920px){.two-col{grid-template-columns:1fr;} .form-grid{grid-template-columns:1fr;} .sidebar{width:210px;flex-basis:210px;}}
@media (max-width:680px){.sidebar{display:none;} .main{padding:18px 14px 50px;} .topbar{padding:12px 16px;}}

.type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.type-card{border:1.5px solid var(--border);border-radius:9px;padding:12px;cursor:pointer;background:var(--surface);}
.type-card:hover{border-color:var(--accent);}
.type-card.selected{border-color:var(--accent);background:var(--accent-soft);}
.type-card .ti{font-size:18px;margin-bottom:5px;}

const NOW = new Date();
function d(offsetDays, offsetHours){
  const dt = new Date(NOW.getTime());
  dt.setDate(dt.getDate() + (offsetDays||0));
  if(offsetHours) dt.setHours(dt.getHours()+offsetHours);
  return dt;
}
function fmtDate(dt){
  return dt.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});
}
function fmtDateShort(dt){
  return dt.toLocaleDateString('en-PH',{month:'short',day:'numeric'});
}
function fmtTime(dt){
  return dt.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'});
}
function fmtDateTime(dt){ return fmtDate(dt)+', '+fmtTime(dt); }
function fmtMoney(n){
  return '₱'+n.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtMoneyShort(n){
  return '₱'+Math.round(n).toLocaleString('en-PH');
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function relTime(dt){
  const diffMs = dt.getTime()-NOW.getTime();
  const mins = Math.round(diffMs/60000);
  const days = Math.round(diffMs/(60000*60*24));
  if(Math.abs(mins)<60) return mins===0?'just now':(mins<0?`${-mins}m ago`:`in ${mins}m`);
  if(Math.abs(days)<1) { const hrs=Math.round(diffMs/3600000); return hrs<0?`${-hrs}h ago`:`in ${hrs}h`; }
  if(days<0) return `${-days}d ago`;
  return `in ${days}d`;
}

function slaState(t){
  if(t.status==='Resolved'||t.status==='Closed') return {label:'N/A', cls:'pill-neutral'};
  if(t.status==='Pending Client Info') return {label:'Paused', cls:'pill-info'};

  if(msLeft<0) return {label:'Breached', cls:'pill-critical'};
  if(msLeft < 24*3600*1000) return {label:'At risk', cls:'pill-warning'};
  return {label:'On track', cls:'pill-good'};
}

  return `<span class="pill ${map[status]||'pill-neutral'}"><span class="dot"></span>${status}</span>`;
}

}

}

/* ---------------- Personal access links (URL hash routing) ----------------
   Each stakeholder can be handed a link like #role=rep&rep=carlo that opens
   the portal straight into their own view — see USER_LINKS above. The hash
   always mirrors the live state, so "Copy my link" works from anywhere. */
function applyHashState(){
  const raw = location.hash.replace(/^#/,'');
  if(!raw) return;
  const params = new URLSearchParams(raw);
  const role = params.get('role');
  if(role && NAV[role]) STATE.role = role;
  const rep = params.get('rep'); if(rep && REPS[rep]) STATE.activeRep = rep;
  const csm = params.get('csm'); if(csm && CSMS[csm]) STATE.activeCsm = csm;
  const view = params.get('view');
  STATE.view = (view && NAV[STATE.role].some(n=>n.id===view)) ? view : NAV[STATE.role][0].id;
  STATE.activeTicket = null;
}
function currentHash(){
  const p = new URLSearchParams();
  p.set('role', STATE.role);
  if(STATE.role==='rep') p.set('rep', STATE.activeRep);
  if(STATE.role==='csm') p.set('csm', STATE.activeCsm);
  p.set('view', STATE.view);
  return '#'+p.toString();
}
function syncHash(){
  const h = currentHash();
  if(location.hash!==h) history.replaceState(null,'',h);
}
function linkFor(hashStr){
  return location.origin+location.pathname+'#'+hashStr;
}
function currentUserLink(){
  const match = USER_LINKS.find(u=>{
    const up = new URLSearchParams(u.hash);
    if(up.get('role')!==STATE.role) return false;
    if(STATE.role==='rep') return up.get('rep')===STATE.activeRep;
    if(STATE.role==='csm') return up.get('csm')===STATE.activeCsm;
    return true;
  });
  return match ? linkFor(match.hash) : linkFor(currentHash().slice(1));
}

function copyToClipboard(text){
  return new Promise((resolve,reject)=>{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(resolve).catch(()=>fallbackCopy(text,resolve,reject));
    } else {
      fallbackCopy(text,resolve,reject);
    }
  });
}
function fallbackCopy(text,resolve,reject){
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    ok?resolve():reject();
  }catch(e){ reject(e); }
}

  const who = typeof rm.who==='function'?rm.who():rm.who;
  copyToClipboard(url).then(()=>showToast(`Link copied — opens as ${who}`)).catch(()=>showLinkFallback(url));
}
function copyLinkFor(hashStr, name){
  copyToClipboard(linkFor(hashStr)).then(()=>showToast(`Link copied for ${name}`)).catch(()=>showLinkFallback(linkFor(hashStr)));
}
function showLinkFallback(url){
  openModal(`
    <div class="modal-head"><div><h3>Copy this link</h3><p>Clipboard access was blocked — copy it manually.</p></div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><input type="text" readonly value="${esc(url)}" onclick="this.select()" style="width:100%;"></div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="closeModal()">Done</button></div>
  `);
}

/* ---------------- Toast ---------------- */
let toastTimer=null;
function showToast(msg){
  const root=document.getElementById('toast-root');
  root.innerHTML = `<div class="toast"><span class="toast-dot"></span>${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{root.innerHTML='';},3400);
}

/* ---------------- Modal ---------------- */
function openModal(html, extraClass){
  document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" onmousedown="if(event.target===this) closeModal()"><div class="modal ${extraClass||''}">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function notifsFor(role){
  if(role==='client') return NOTIFICATIONS.filter(n=>n.for.type==='client' && n.for.id===CLIENT_USER.clientId);

  if(role==='lead') return NOTIFICATIONS.filter(n=>n.for.type==='lead');
  if(role==='csm') return [];
  return [];
}

function renderView(){

    if(STATE.activeTicket) return viewTicketDetail(STATE.activeTicket, 'client');
    if(STATE.view==='dashboard') return viewClientDashboard();
    if(STATE.view==='invoices') return viewClientInvoices();
    if(STATE.view==='requests') return viewClientRequests();
    if(STATE.view==='payments') return viewClientPayments();
    if(STATE.view==='standing') return viewClientStanding();
    if(STATE.view==='notifications') return viewNotifications('client');

  if(STATE.role==='rep'){
    if(STATE.activeTicket) return viewTicketDetail(STATE.activeTicket, 'rep');
    if(STATE.view==='queue') return viewRepQueue();
    if(STATE.view==='kpi') return viewRepKPI();
    if(STATE.view==='notifications') return viewNotifications('rep');

  return '<div class="empty">Nothing here yet.</div>';

          </div>`).join('') : `<div class="empty">No open requests</div>`}

    </div>
  </div>`;

function recentActivityRows(tickets){
  const events = [];
  tickets.forEach(t=>{
    events.push({at:t.createdAt, text:`Filed "${t.subject}"`, icon:TYPE_META[t.type].icon});
    t.comments.forEach(c=>events.push({at:c.at, text:`${c.author} responded on "${t.subject}"`, icon:'💬'}));
    if(t.resolvedAt) events.push({at:t.resolvedAt, text:`"${t.subject}" marked Resolved`, icon:'✅'});
  });
  INVOICES.filter(i=>i.status==='Paid').forEach(i=>events.push({at:i.paidOn, text:`Payment reconciled for ${i.id} (${i.receipt})`, icon:'💳'}));
  events.sort((a,b)=>b.at-a.at);
  if(!events.length) return `<div class="empty">No recent activity</div>`;
  return events.slice(0,6).map(e=>`
    <div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);">
      <span style="flex:0 0 auto;">${e.icon}</span>
      <div style="flex:1;"><div style="font-size:13px;">${esc(e.text)}</div><div class="row-sub">${fmtDateTime(e.at)}</div></div>
    </div>`).join('');
}

/* ---- LPC (Late Payment Charge) calculator ---- */
function openLpcModal(invId){
  openModal(`
    <div class="modal-head"><div><h3>Late Payment Charge calculator</h3><p>Estimate based on days overdue. Placeholder rate — confirm with Finance.</p></div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-field"><label>If you pay on</label><input type="date" id="lpc-date" value="${new Date().toISOString().slice(0,10)}" onchange="updateLpcCalc('${invId}')"></div>
      <div id="lpc-result"></div>
      <div class="form-hint">Placeholder rate: 1%/day overdue — confirm the actual rate with Finance before this goes live.</div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Close</button></div>
  `);
  updateLpcCalc(invId);
}
function updateLpcCalc(invId){
  const inv = invoiceById(invId);
  const dateEl = document.getElementById('lpc-date');
  if(!inv || !dateEl) return;
  const payDate = new Date(dateEl.value+'T00:00:00');
  const dueDate = new Date(inv.due.getFullYear(), inv.due.getMonth(), inv.due.getDate());
  const daysLate = Math.max(0, Math.round((payDate-dueDate)/86400000));
  const lpc = Math.round(inv.amount*LPC_RATE_PER_DAY*daysLate);
  const total = inv.amount+lpc;
  document.getElementById('lpc-result').innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;"><span>Days overdue by that date</span><span class="mono">${daysLate}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;"><span>LPC charge</span><span class="mono">${fmtMoneyShort(lpc)}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;border-top:1px solid var(--border);padding-top:8px;margin-top:2px;"><span>Total payable</span><span class="mono">${fmtMoneyShort(total)}</span></div>
  `;
}

function headcountRowsFor(inv){

    {site:'Cebu Site', role:'QA Specialist', seats:Math.max(1,Math.round(seatBase*0.07)), rate:2500},

function viewHeadcountCSV(invId){

function attachmentNameFor(type){
  return {dispute:'dispute-support.pdf', service_invoice:'entity-change-request.pdf', headcount:'headcount-notes.pdf', general_inquiry:'attachment.pdf'}[type] || 'attachment.pdf';
}
function submitNewRequest(){
  const t = STATE._reqType;
  const subject = document.getElementById('f-subject').value.trim() || TYPE_META[t].label;
  const details = document.getElementById('f-details').value.trim() || '(no additional details provided)';
  const invoiceEl = document.getElementById('f-invoice');
  const relatedInvoice = invoiceEl ? (invoiceEl.value||null) : null;
  const reasonEl = document.getElementById('f-reason');
  const reason = reasonEl ? reasonEl.value : null;
  const amountEl = document.getElementById('f-amount');
  const amount = amountEl ? amountEl.value.trim() : null;
  const attachEl = document.getElementById('f-attach');
  const attachments = (attachEl && attachEl.classList.contains('has-file')) ? [attachmentNameFor(t)] : [];
  const client = CLIENTS[CLIENT_USER.clientId];
  const ticket = {
    id: nextTicketId(), type:t, clientId:client.id, requester:CLIENT_USER.name, pic:client.pic, status:'New',
    subject, details, relatedInvoice, reason: reason||null, amount: amount||null,
    createdAt:new Date(), slaDue:new Date(Date.now()+SLA_DAYS[t]*24*3600*1000),
    resolvedAt:null, comments:[], attachments, reassignedFrom:null,
  };
  TICKETS.unshift(ticket);
  NOTIFICATIONS.unshift({id:'N'+ticket.id+'a', for:{type:'rep',id:client.pic}, at:new Date(), text:`New ${TYPE_META[t].label.toLowerCase()} filed by ${client.name} — auto-assigned to you.`, read:false, ticketId:ticket.id});
  NOTIFICATIONS.unshift({id:'N'+ticket.id+'b', for:{type:'lead'}, at:new Date(), text:`${client.name} filed a ${TYPE_META[t].label.toLowerCase()} — routed to ${REPS[client.pic].name}.`, read:false, ticketId:ticket.id});
  closeModal();
  showToast(`Request submitted — routed to ${REPS[client.pic].name}`);
  setView('requests');
}

function submitProofOfPayment(){
  const bank = document.getElementById('p-bank').value;
  const date = document.getElementById('p-date').value;
  const amount = document.getElementById('p-amount').value.trim();
  const ref = document.getElementById('p-ref').value.trim();
  const cwt = document.getElementById('p-cwt').checked;
  const checked = Array.from(document.querySelectorAll('input[name=p-inv]:checked')).map(el=>el.value);
  const client = CLIENTS[CLIENT_USER.clientId];
  const attachments = [];
  if(document.getElementById('p-proof-file').classList.contains('has-file')) attachments.push('deposit-slip.jpg');
  if(cwt && document.getElementById('p-2307-file').classList.contains('has-file')) attachments.push('BIR-2307.pdf');
  const ticket = {
    id: nextTicketId(), type:'proof_of_payment', clientId:client.id, requester:CLIENT_USER.name, pic:client.pic, status:'New',
    subject:`Proof of payment — ${checked.join(', ')||'unapplied'}`,
    details:`Bank transfer submitted via ${bank}${date?' on '+fmtDate(new Date(date+'T00:00:00')):''}. Awaiting Finance reconciliation against NetSuite.`,
    relatedInvoice:checked[0]||null, invoicesApplied:checked, bank, amountPaid: amount||null, refNo: ref||null, cwt,
    createdAt:new Date(), slaDue:new Date(Date.now()+SLA_DAYS.proof_of_payment*24*3600*1000),
    resolvedAt:null, comments:[], attachments, reassignedFrom:null,
  };
  TICKETS.unshift(ticket);
  NOTIFICATIONS.unshift({id:'N'+ticket.id+'a', for:{type:'rep',id:client.pic}, at:new Date(), text:`Proof of payment submitted by ${client.name} — awaiting reconciliation.`, read:false, ticketId:ticket.id});
  closeModal();
  showToast('Proof of payment submitted for reconciliation');
  setView('payments');
}

/* ============================================================
   KPI / PERFORMANCE REPORTING (shared by Finance Rep & Team Lead)
   Daily / Weekly / Monthly / Custom-range buckets over received,
   resolved, and pending requests — per associate and per team.
   ============================================================ */
function startOfDay(dt){ const x=new Date(dt); x.setHours(0,0,0,0); return x; }
function endOfDay(dt){ const x=new Date(dt); x.setHours(23,59,59,999); return x; }
function addDaysDate(dt,n){ const x=new Date(dt); x.setDate(x.getDate()+n); return x; }

function getKpiBuckets(){
  const k = STATE.kpi;
  const buckets=[];
  if(k.mode==='daily'){
    for(let i=13;i>=0;i--){ const day=addDaysDate(NOW,-i); buckets.push({label:day.toLocaleDateString('en-PH',{month:'short',day:'numeric'}), start:startOfDay(day), end:endOfDay(day)}); }
  } else if(k.mode==='weekly'){
    for(let i=7;i>=0;i--){
      const end = endOfDay(addDaysDate(NOW,-7*i));
      const start = startOfDay(addDaysDate(end,-6));
      buckets.push({label:'Wk of '+start.toLocaleDateString('en-PH',{month:'short',day:'numeric'}), start, end});
    }
  } else if(k.mode==='monthly'){
    for(let i=5;i>=0;i--){
      const ref = new Date(NOW.getFullYear(), NOW.getMonth()-i, 1);
      const start = new Date(ref.getFullYear(), ref.getMonth(), 1);
      const end = endOfDay(new Date(ref.getFullYear(), ref.getMonth()+1, 0));
      buckets.push({label:start.toLocaleDateString('en-PH',{month:'short',year:'2-digit'}), start, end});
    }
  } else { // custom
    const from = k.from ? startOfDay(new Date(k.from+'T00:00:00')) : startOfDay(addDaysDate(NOW,-13));
    const to = k.to ? endOfDay(new Date(k.to+'T00:00:00')) : endOfDay(NOW);
    const totalDays = Math.max(1, Math.round((startOfDay(to)-startOfDay(from))/864e5)+1);
    if(totalDays<=31){
      for(let i=0;i<totalDays;i++){ const day=addDaysDate(from,i); const end=endOfDay(day); buckets.push({label:day.toLocaleDateString('en-PH',{month:'short',day:'numeric'}), start:startOfDay(day), end: end>to?to:end}); }
    } else {
      let cur = new Date(from);
      while(cur<=to){
        const start = new Date(cur);
        const rawEnd = endOfDay(addDaysDate(start,6));
        buckets.push({label:'Wk of '+start.toLocaleDateString('en-PH',{month:'short',day:'numeric'}), start, end: rawEnd>to?to:rawEnd});
        cur = addDaysDate(cur,7);
      }
    }
  }
  return buckets;
}
function kpiRangeLabel(buckets){
  if(!buckets.length) return '';
  return `${fmtDate(buckets[0].start)} – ${fmtDate(buckets[buckets.length-1].end)}`;
}
function kpiSeries(repIds, buckets){
  const subset = repIds==='all' ? TICKETS : TICKETS.filter(t=>repIds.includes(t.pic));
  return buckets.map(b=>{
    const received = subset.filter(t=>t.createdAt>=b.start && t.createdAt<=b.end).length;
    const resolved = subset.filter(t=>t.resolvedAt && t.resolvedAt>=b.start && t.resolvedAt<=b.end).length;
    const pending = subset.filter(t=>t.createdAt<=b.end && (!t.resolvedAt || t.resolvedAt>b.end)).length;
    return {...b, received, resolved, pending};
  });
}
function kpiTotals(repIds, buckets){
  const series = kpiSeries(repIds, buckets);
  const received = series.reduce((s,x)=>s+x.received,0);
  const resolved = series.reduce((s,x)=>s+x.resolved,0);
  const subsetAll = repIds==='all' ? TICKETS : TICKETS.filter(t=>repIds.includes(t.pic));
  const pendingNow = openTickets(subsetAll).length;
  const start = buckets[0].start, end = buckets[buckets.length-1].end;
  const resolvedInRange = subsetAll.filter(t=>t.resolvedAt && t.resolvedAt>=start && t.resolvedAt<=end);
  const avgResDays = resolvedInRange.length ? resolvedInRange.reduce((s,t)=>s+((t.resolvedAt-t.createdAt)/864e5),0)/resolvedInRange.length : null;
  const onTime = resolvedInRange.filter(t=>t.resolvedAt<=t.slaDue).length;
  const slaCompliance = resolvedInRange.length ? Math.round(100*onTime/resolvedInRange.length) : null;
  return {received, resolved, pendingNow, avgResDays, slaCompliance, resolvedInRangeCount:resolvedInRange.length};
}

      ${reps.map(r=>{
        const c = repOpenCounts(r.id);
        return `<div class="rep-row">
          <div class="rep-avatar">${r.initials}</div>
          <div class="rep-info"><div class="rep-name">${r.name}</div><div class="rep-sub">${c.open} open · ${c.total} total</div></div>
          <div class="rep-bar-wrap"><div class="hbar-track"><div class="hbar-fill" style="width:${100*c.open/maxOpen}%"></div></div></div>
          <div class="rep-flags">
            ${c.atRisk?`<span class="pill pill-warning">${c.atRisk} at risk</span>`:''}
            ${c.breached?`<span class="pill pill-critical">${c.breached} breached</span>`:''}
            ${(!c.atRisk && !c.breached)?`<span class="pill pill-good">On track</span>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>
  <div class="section">
    <div class="section-head"><h2>All team tickets</h2><span class="hint">Full visibility across both reps</span></div>
    <div class="card">
      <div class="table-wrap">
      <table>
        <thead><tr><th>Client</th><th>PIC</th><th>Type</th><th>Subject</th><th>Status</th><th>SLA</th></tr></thead>
        <tbody>
          ${TICKETS.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,12).map(t=>`
            <tr class="clickable" onclick="openTicket('${t.id}')">
              <td class="row-title">${CLIENTS[t.clientId].name}</td>
              <td>${REPS[t.pic].name}</td>
              <td>${TYPE_META[t.type].icon} ${TYPE_META[t.type].label}</td>
              <td class="wrap">${esc(t.subject)}</td>
              <td>${statusPill(t.status)}</td>
              <td>${slaPill(t)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
      </div>
    </div>
  </div>`;
}

function viewLeadEscalations(){
  const list = allEscalations();
  const reps = Object.values(REPS);
  return `
  <div class="section">
    <div class="section-head"><h2>SLA escalations</h2><span class="hint">Tickets at risk of or breaching their SLA</span></div>
    ${list.length?`
    <div class="card">
      <div class="table-wrap">
      <table>
        <thead><tr><th>Client</th><th>PIC</th><th>Subject</th><th>SLA due</th><th>Status</th><th>Reassign</th></tr></thead>
        <tbody>
          ${list.map(t=>`
            <tr>
              <td class="row-title" style="cursor:pointer;" onclick="openTicket('${t.id}')">${CLIENTS[t.clientId].name}</td>
              <td>${REPS[t.pic].name}</td>
              <td class="wrap" style="cursor:pointer;" onclick="openTicket('${t.id}')">${esc(t.subject)}</td>
              <td>${fmtDate(t.slaDue)}</td>
              <td>${slaPill(t)}</td>
              <td>
                <div style="display:flex;gap:6px;">
                  <select id="reassign-${t.id}" class="btn-sm" style="padding:5px 7px;">
                    ${reps.filter(r=>r.id!==t.pic).map(r=>`<option value="${r.id}">${r.name}</option>`).join('')}
                  </select>
                  <button class="btn btn-sm" onclick="leadReassign('${t.id}')">Reassign</button>
                </div>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
      </div>
    </div>` : `<div class="card"><div class="empty">🎉 No tickets currently at risk or breaching SLA.</div></div>`}
  </div>`;
}
function leadReassign(id){
  const t = TICKETS.find(x=>x.id===id);
  const target = document.getElementById('reassign-'+id).value;
  const from = t.pic;
  t.reassignedFrom = from; t.pic = target;
  NOTIFICATIONS.unshift({id:'N'+t.id+'lreassign', for:{type:'rep',id:target}, at:new Date(), text:`Ticket "${t.subject}" was reassigned to you by Angela Tan (Team Lead).`, read:false, ticketId:t.id});
  showToast(`Reassigned "${t.subject}" to ${REPS[target].name}`);
  render();
}

function viewLeadReports(){
  const buckets = getKpiBuckets();
  const filterReps = STATE.kpi.repFilter==='all' ? 'all' : [STATE.kpi.repFilter];
  const isFiltered = filterReps!=='all';
  const chartSeries = kpiSeries(filterReps, buckets);
  const scopedTotals = kpiTotals(filterReps, buckets);
  const rangeStart = buckets[0].start, rangeEnd = buckets[buckets.length-1].end;
  const scopeLabel = isFiltered ? REPS[STATE.kpi.repFilter].name : 'whole team';

  const reasonCounts = {};
  TICKETS.filter(t=>t.type==='dispute' && t.createdAt>=rangeStart && t.createdAt<=rangeEnd && (!isFiltered || filterReps.includes(t.pic))).forEach(t=>{
    const r = t.subject.toLowerCase().includes('headcount')?'Headcount discrepancy':
      t.subject.toLowerCase().includes('surcharge')?'Unapproved surcharge':
      t.subject.toLowerCase().includes('minimum')?'Billing terms disagreement':'Other';
    reasonCounts[r]=(reasonCounts[r]||0)+1;
  });
  const reasonList = Object.entries(reasonCounts).sort((a,b)=>b[1]-a[1]);
  const maxReason = Math.max(1,...reasonList.map(x=>x[1]));

  return `
  ${introBanner(`This <b>Reports &amp; KPIs</b> page implements Section 13 of the design doc — daily/weekly/monthly reporting on ticket volume and handling per Finance Rep, now with a customizable date range and a combined per-associate / per-team view.`)}
  <div class="section">
    <div class="section-head"><h2>${isFiltered?REPS[STATE.kpi.repFilter].name+'’s performance':'Team performance'}</h2><span class="hint">${kpiRangeLabel(buckets)}</span></div>
    ${kpiControlsHtml({repFilter:true})}
    <div class="tiles">
      ${kpiTile('Received', scopedTotals.received, scopeLabel+', selected period')}
      ${kpiTile('Resolved', scopedTotals.resolved, scopedTotals.resolvedInRangeCount?'in selected period':'')}
      ${kpiTile('Currently pending', scopedTotals.pendingNow, isFiltered?'open, assigned to '+REPS[STATE.kpi.repFilter].name:'open across the team', scopedTotals.pendingNow?'accent-warning':'accent-good')}
      ${kpiTile('Avg. resolution time', scopedTotals.avgResDays!=null? scopedTotals.avgResDays.toFixed(1)+' days':'—')}
      ${kpiTile('SLA compliance', scopedTotals.slaCompliance!=null? scopedTotals.slaCompliance+'%':'—', 'resolved on time', scopedTotals.slaCompliance!=null && scopedTotals.slaCompliance<80?'accent-critical':'accent-good')}
    </div>
  </div>

  <div class="section">
    <div class="section-head"><h2>Received vs. resolved</h2><span class="hint">${isFiltered?REPS[STATE.kpi.repFilter].name:'Whole team'}</span></div>
    <div class="card card-pad">${groupedBarsHtml(chartSeries)}</div>
  </div>

  <div class="section">
    <div class="section-head"><h2>Performance per associate</h2><span class="hint">Received, resolved &amp; pending — ${kpiRangeLabel(buckets)}</span></div>
    ${Object.values(TEAMS).map(team=>{
      const rows = team.reps.map(rid=>({r:REPS[rid], t:kpiTotals([rid], buckets)}));
      const teamAgg = kpiTotals(team.reps, buckets);
      return `
      <div class="kpi-team-head"><h3>${team.name}</h3><span class="hint">Lead: ${LEAD.name}</span></div>
      <div class="card">
        <div class="table-wrap">
        <table>
          <thead><tr><th>Associate</th><th>Received</th><th>Resolved</th><th>Pending</th><th>Resolution rate</th><th>Avg. days</th><th>SLA compliance</th></tr></thead>
          <tbody>
            ${rows.map(({r,t})=>`
              <tr ${isFiltered && r.id===STATE.kpi.repFilter?'style="background:var(--accent-soft);"':''}>
                <td class="row-title">${r.name}</td>
                <td class="mono">${t.received}</td>
                <td class="mono">${t.resolved}</td>
                <td class="mono">${t.pendingNow}</td>
                <td class="mono">${t.received? Math.round(100*t.resolved/t.received)+'%':'—'}</td>
                <td class="mono">${t.avgResDays!=null? t.avgResDays.toFixed(1):'—'}</td>
                <td>${t.slaCompliance!=null?`<span class="pill ${t.slaCompliance>=90?'pill-good':t.slaCompliance>=75?'pill-warning':'pill-critical'}">${t.slaCompliance}%</span>`:'<span class="pill pill-neutral">—</span>'}</td>
              </tr>`).join('')}
            <tr class="kpi-total">
              <td class="row-title">${team.name} total</td>
              <td class="mono">${teamAgg.received}</td>
              <td class="mono">${teamAgg.resolved}</td>
              <td class="mono">${teamAgg.pendingNow}</td>
              <td class="mono">${teamAgg.received? Math.round(100*teamAgg.resolved/teamAgg.received)+'%':'—'}</td>
              <td class="mono">${teamAgg.avgResDays!=null? teamAgg.avgResDays.toFixed(1):'—'}</td>
              <td>${teamAgg.slaCompliance!=null?`<span class="pill ${teamAgg.slaCompliance>=90?'pill-good':teamAgg.slaCompliance>=75?'pill-warning':'pill-critical'}">${teamAgg.slaCompliance}%</span>`:'<span class="pill pill-neutral">—</span>'}</td>
            </tr>
          </tbody>
        </table>
        </div>
      </div>`;
    }).join('')}
  </div>

  <div class="section">
    <div class="section-head"><h2>Dispute-reason breakdown</h2><span class="hint">${isFiltered?scopeLabel+' · ':''}${kpiRangeLabel(buckets)}</span></div>
    <div class="card card-pad">
      ${reasonList.length? reasonList.map(([label,val])=>`
        <div class="hbar-row"><div class="hbar-label">${label}</div><div class="hbar-track"><div class="hbar-fill" style="width:${100*val/maxReason}%"></div></div><div class="hbar-val">${val}</div></div>
      `).join('') : `<div class="empty">No disputes recorded in this period</div>`}
    </div>
  </div>

  <div class="section">
    <div class="section-head"><h2>Scheduled reports</h2></div>
    <div class="card card-pad" style="display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;"><span>Daily tickets-received digest</span><span class="pill pill-good">Active · emailed daily 8:00 AM</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;"><span>Weekly trend report</span><span class="pill pill-good">Active · emailed Monday mornings</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;"><span>Monthly trend & SLA compliance report</span><span class="pill pill-good">Active · emailed 1st of month</span></div>
    </div>
  </div>`;
}

function viewRepKPI(){
  const rep = REPS[STATE.activeRep];
  const buckets = getKpiBuckets();
  const series = kpiSeries([rep.id], buckets);
  const totals = kpiTotals([rep.id], buckets);
  const rangeStart = buckets[0].start, rangeEnd = buckets[buckets.length-1].end;
  const repTickets = TICKETS.filter(t=>t.pic===rep.id);
  const typeCounts = Object.keys(TYPE_META).map(k=>({key:k, label:TYPE_META[k].label, icon:TYPE_META[k].icon,
    count: repTickets.filter(t=>t.type===k && t.createdAt>=rangeStart && t.createdAt<=rangeEnd).length}));
  const maxType = Math.max(1,...typeCounts.map(t=>t.count));

  return `
  ${introBanner(`This <b>My Performance</b> page implements Section 13.1 of the design doc — a Finance Rep's personal summary of assigned tickets by status and type, with a configurable reporting window.`)}
  <div class="section">
    <div class="section-head"><h2>My performance</h2><span class="hint">${rep.name} · ${kpiRangeLabel(buckets)}</span></div>
    ${kpiControlsHtml({repFilter:false})}
    <div class="tiles">
      ${kpiTile('Received', totals.received, 'requests routed to you')}
      ${kpiTile('Resolved', totals.resolved, totals.resolvedInRangeCount?'in selected period':'')}
      ${kpiTile('Currently open', totals.pendingNow, 'across all time', totals.pendingNow?'accent-warning':'accent-good')}
      ${kpiTile('Avg. resolution time', totals.avgResDays!=null? totals.avgResDays.toFixed(1)+' days':'—', totals.resolvedInRangeCount?'across '+totals.resolvedInRangeCount+' resolved':'No resolutions in range')}
      ${kpiTile('SLA compliance', totals.slaCompliance!=null? totals.slaCompliance+'%':'—', 'resolved on time', totals.slaCompliance!=null && totals.slaCompliance<80?'accent-critical':'accent-good')}
    </div>
  </div>

  <div class="section">
    <div class="section-head"><h2>Received vs. resolved</h2><span class="hint">${kpiRangeLabel(buckets)}</span></div>
    <div class="card card-pad">${groupedBarsHtml(series)}</div>
  </div>

  <div class="section">
    <div class="section-head"><h2>By request type</h2><span class="hint">Selected period</span></div>
    <div class="card card-pad">
      ${typeCounts.some(t=>t.count>0)? typeCounts.map(t=>`
        <div class="hbar-row"><div class="hbar-label">${t.icon} ${t.label}</div><div class="hbar-track"><div class="hbar-fill" style="width:${100*t.count/maxType}%"></div></div><div class="hbar-val">${t.count}</div></div>
      `).join('') : `<div class="empty">No requests in this period</div>`}
    </div>
  </div>

  <div class="card card-pad" style="font-size:12px;color:var(--text-faint);">
    Per the design's role-based access matrix (Section 15.1), Finance Reps see their own performance summary here. Team Leads see full team and per-associate reporting under <b>Reports &amp; KPIs</b>.
  </div>`;
}

/* ============================================================
   CSM / SALES (read-only) VIEWS
   ============================================================ */
function viewCsmOverview(){
  const csm = CSMS[STATE.activeCsm];
  const myClients = Object.values(CLIENTS).filter(c=>c.csm===csm.id||c.sales===csm.id);
  return `
  ${introBanner(`This prototype simulates the <b>read-only CSM/Sales</b> view — billing ticket and invoice status for accounts they own, with the option to leave an internal note for Finance.`)}
  <div class="section">
    <div class="section-head"><h2>Your accounts</h2><span class="hint">Read-only — billing status for context, not case handling</span></div>
    ${myClients.map(c=>{
      const tickets = ticketsForClient(c.id);
      const open = openTickets(tickets);
      return `
      <div class="card card-pad" style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
          <div>
            <div class="row-title" style="font-size:14.5px;">${c.name}</div>
            <div class="row-sub">${c.tier} plan · PIC ${REPS[c.pic].name} · ${c.csm===csm.id?'You are CSM':''}${c.csm===csm.id&&c.sales===csm.id?' & Sales':''}${c.sales===csm.id&&c.csm!==csm.id?'You are Sales Rep':''}</div>
          </div>
          <span class="pill ${open.length?'pill-warning':'pill-good'}">${open.length} open billing item(s)</span>
        </div>
        ${tickets.length?`
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">
          ${tickets.slice(0,3).map(t=>`
            <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-top:1px solid var(--border-soft);">
              <span>${TYPE_META[t.type].icon} ${esc(t.subject)}</span>
              <span style="display:flex;gap:6px;">${statusPill(t.status)}${slaPill(t)}</span>
            </div>`).join('')}
        </div>` : `<div class="form-hint" style="margin-top:10px;">No billing tickets on file.</div>`}
        <div style="margin-top:12px;display:flex;gap:8px;">
          <input type="text" id="note-${c.id}" placeholder="Leave an internal note for Finance (not visible to client)..." style="flex:1;">
          <button class="btn btn-sm" onclick="leaveInternalNote('${c.id}')">Add note</button>
        </div>
      </div>`;
    }).join('') || `<div class="empty">No accounts assigned</div>`}
  </div>`;
}
function leaveInternalNote(clientId){
  const input = document.getElementById('note-'+clientId);
  const text = input.value.trim();
  if(!text) return;
  INTERNAL_NOTES.push({clientId, author:STATE.activeCsm, at:new Date(), text});
  input.value='';
  showToast('Internal note added — visible to Finance only');
  render();
}

/* ---------------- Init ---------------- */
applyHashState();
render();
window.addEventListener('hashchange', ()=>{ applyHashState(); render(); });
</script>
